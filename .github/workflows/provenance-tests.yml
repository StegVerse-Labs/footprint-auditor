name: provenance-tests

on:
  push:
    paths:
      - 'src/provenance/**'
      - 'tests/test_historical_provenance.py'
      - 'config/provenance_audit.yaml'
      - '.github/workflows/provenance-tests.yml'
  pull_request:
    paths:
      - 'src/provenance/**'
      - 'tests/test_historical_provenance.py'
      - 'config/provenance_audit.yaml'
      - '.github/workflows/provenance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run provenance tests
        run: python -m pytest -q tests/test_historical_provenance.py
