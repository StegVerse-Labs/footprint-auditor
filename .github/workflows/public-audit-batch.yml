name: public-audit-batch

on:
  push:
    paths:
      - 'scripts/materialize_public_batch.py'
      - 'tests/test_public_materialization.py'
      - 'tests/test_exact_inventory_manifest.py'
      - 'config/public-audit-batch-*.txt'
      - 'evidence/inventory/connected-repositories-2026-08-19-v2.csv'
      - 'src/provenance/**'
      - '.github/workflows/public-audit-batch.yml'
  pull_request:
    paths:
      - 'scripts/materialize_public_batch.py'
      - 'tests/test_public_materialization.py'
      - 'tests/test_exact_inventory_manifest.py'
      - 'config/public-audit-batch-*.txt'
      - 'evidence/inventory/connected-repositories-2026-08-19-v2.csv'
      - 'src/provenance/**'
      - '.github/workflows/public-audit-batch.yml'
      - 'evidence/verification/public-audit-batch-*.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_AUDIT_SELECTION: config/public-audit-batch-002.txt
  PUBLIC_AUDIT_EXPECTED_COUNT: '10'
  PUBLIC_AUDIT_RECEIPT: /tmp/public-audit-batch-002-receipt.json
  PUBLIC_AUDIT_CUTOFF: 2026-08-19T23:59:59Z

jobs:
  public-cutoff-audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout auditor source without persisted credential
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded validation dependency
        run: python -m pip install pytest==8.4.1

      - name: Validate inventory and credentialless materialization boundary
        run: >-
          python -m pytest -q
          tests/test_exact_inventory_manifest.py
          tests/test_public_materialization.py

      - name: Materialize exact public cutoff batch anonymously
        shell: bash
        run: |
          rm -rf /tmp/public-materialized /tmp/public-manifest.json "$PUBLIC_AUDIT_RECEIPT"
          python scripts/materialize_public_batch.py \
            --inventory evidence/inventory/connected-repositories-2026-08-19-v2.csv \
            --selection "$PUBLIC_AUDIT_SELECTION" \
            --root /tmp/public-materialized \
            --cutoff "$PUBLIC_AUDIT_CUTOFF" \
            --output /tmp/public-manifest.json

      - name: Emit secret-free exact cutoff manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('/tmp/public-manifest.json').read_text())
          assert manifest['schema'] == 'stegverse.materialized-repository-manifest.v1'
          assert len(manifest['repositories']) == int(os.environ['PUBLIC_AUDIT_EXPECTED_COUNT'])
          for row in sorted(manifest['repositories'], key=lambda x: x['repository']):
              print(f"MATERIALIZED {row['repository']} {row['expected_sha']}")
          PY

      - name: Execute public provenance audit batch
        shell: bash
        run: |
          inventory_digest="$(sha256sum evidence/inventory/connected-repositories-2026-08-19-v2.csv | awk '{print $1}')"
          python -m src.provenance.audit_runner \
            --manifest /tmp/public-manifest.json \
            --findings-dir evidence/findings \
            --output "$PUBLIC_AUDIT_RECEIPT" \
            --boundary-end "$PUBLIC_AUDIT_CUTOFF" \
            --installation-count 3 \
            --inventory-digest "$inventory_digest" \
            --observed-at 2026-08-22T12:02:00Z

      - name: Verify and emit compact batch receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.provenance.audit_runner import verify_execution_receipt
          receipt = json.loads(Path(os.environ['PUBLIC_AUDIT_RECEIPT']).read_text())
          assert receipt['execution_complete'] is True
          assert receipt['executed_repository_count'] == int(os.environ['PUBLIC_AUDIT_EXPECTED_COUNT'])
          assert receipt['audit_open'] is True
          assert receipt['credential_received_by_runner'] is False
          assert receipt['network_access_required_by_runner'] is False
          assert verify_execution_receipt(receipt)
          print('BATCH_EXECUTION_RECEIPT', receipt['execution_receipt_sha256'])
          print('BATCH_UNRESOLVED', json.dumps(receipt['unresolved_repository_scan_counts'], sort_keys=True, separators=(',', ':')))
          for row in sorted(receipt['repository_receipts'], key=lambda x: x['repository']):
              assert row['credential_received_by_executor'] is False
              assert row['network_access_required'] is False
              print('REPOSITORY_RECEIPT', row['repository'], row['expected_sha'], row['receipt_sha256'])
          PY
