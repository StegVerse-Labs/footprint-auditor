name: footprint-auditor reporter tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/reporter/**'
      - 'tests/test_finding_reporter.py'
      - '.github/workflows/reporter-tests.yml'

permissions:
  contents: read

jobs:
  reporter-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pytest==8.4.1

      - name: Run reporter tests
        run: python -m pytest -q tests/test_finding_reporter.py
